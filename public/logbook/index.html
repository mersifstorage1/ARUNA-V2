<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B40">
<title>Logbook Pengunjung ARUNA</title>
<meta name="description" content="Foto bareng para pengunjung stan ARUNA di pameran inovasi, diperbarui langsung.">
<link rel="icon" href="/app/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#EAF0EC; --bg:#F5F8F6; --paper:#FFFFFF;
    --ink:#10201A; --ink-2:#4A5B52; --muted:#8C9A92; --line:#E4EBE7;
    --green:#158A52; --green-deep:#0F6B40; --green-soft:#E6F4EC;
    --shadow:0 1px 2px rgba(16,32,26,.04),0 8px 22px -12px rgba(16,32,26,.14);
    --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"DM Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.45}
  [hidden]{display:none!important}
  header{background:linear-gradient(160deg,#158A52,#0B3B26);color:#fff;padding:40px 16px 72px;text-align:center}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin:0}
  h1{margin:8px 0 6px;font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;line-height:1.1}
  header p{margin:0 auto;max-width:36em;opacity:.85}
  .meta{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.14);padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px}
  .meta i{width:8px;height:8px;border-radius:50%;background:#4ADE80;animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
  main{max-width:1200px;margin:-48px auto 40px;padding:0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:in .5s cubic-bezier(.22,1,.36,1)}
  @keyframes in{from{opacity:.001;transform:translateY(10px)}}
  .card button{display:block;width:100%;padding:0;border:0;background:#0B3B26;cursor:zoom-in}
  .card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
  .info{padding:12px 16px 14px;display:grid;gap:2px}
  .info b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info span{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info small{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .empty{background:var(--paper);border-radius:20px;padding:48px 16px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
  .lightbox{position:fixed;inset:0;background:rgba(6,40,26,.92);display:grid;place-items:center;padding:16px;z-index:10;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;border-radius:16px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 32px}
  footer a{color:var(--green);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header>
  <p class="eyebrow">Pameran Inovasi · ARUNA</p>
  <h1>Logbook Pengunjung</h1>
  <p>Terima kasih sudah mampir dan foto bareng di stan ARUNA, biodigester pengolah sisa makanan menjadi biogas, pupuk cair, dan kompos.</p>
  <span class="meta"><i></i><span id="count">Memuat…</span></span>
</header>
<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Belum ada foto. Mampir ke stan ARUNA dan jadilah yang pertama!</p>
</main>
<footer><a href="/">aruna-id.web.app</a> · © 2026 Tim ARUNA</footer>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""></div>

<script type="module">
  import { auth, rtdb } from "/assets/js/firebase-init.js";
  import { ref, query, orderByChild, limitToLast, onValue }
    from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const grid = document.getElementById("grid");
  const fmt = new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const lb = document.getElementById("lightbox");
  lb.addEventListener("click", () => { lb.hidden = true; });

  function card(id, d) {
    const el = document.createElement("article");
    el.className = "card";
    el.dataset.id = id;
    const btn = document.createElement("button");
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = `Foto ${d.nama} di stan ARUNA`;
    if (typeof d.foto === "string" && d.foto.startsWith("data:image/jpeg;base64,")) img.src = d.foto;
    btn.append(img);
    btn.addEventListener("click", () => {
      const big = document.getElementById("lbImg");
      big.src = img.src; big.alt = img.alt; lb.hidden = false;
    });
    const info = document.createElement("div");
    info.className = "info";
    const b = document.createElement("b"); b.textContent = d.nama;
    const s = document.createElement("span"); s.textContent = d.instansi;
    const sm = document.createElement("small");
    const t = document.createElement("span"); t.textContent = d.ts ? fmt.format(new Date(d.ts)) : "";
    sm.append(t);
    info.append(b, s, sm);
    el.append(btn, info);
    return el;
  }

  // 120 foto terbaru, terbaru di atas; kartu yang sudah ada tidak digambar ulang
  onValue(query(ref(rtdb, "logbook"), orderByChild("ts"), limitToLast(120)), (snap) => {
    const rows = [];
    snap.forEach((c) => { rows.push([c.key, c.val()]); });
    rows.reverse();
    const old = new Map([...grid.children].map((el) => [el.dataset.id, el]));
    grid.replaceChildren(...rows.map(([id, d]) => old.get(id) || card(id, d)));
    document.getElementById("count").textContent = `${rows.length} pengunjung · live`;
    document.getElementById("empty").hidden = rows.length > 0;
  }, (err) => {
    console.warn(err);
    document.getElementById("count").textContent = "Logbook belum bisa dimuat";
  });
</script>
</body>
</html>
